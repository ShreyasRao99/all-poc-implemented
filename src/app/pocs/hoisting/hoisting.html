<div class="container mt-2">
  <div class="mb-3">
    <label for="pokemon" class="form-label">Pokemon Id/Name</label>
    <input
      type="text"
      class="form-control"
      id="pokemon"
      placeholder="Enter Pokemon ID or Name"
      [value]="inputId()"
      (input)="inputId.set($event.target.value)"
    />
  </div>
  <button
    [disabled]="!inputId() && inputId().length === 0"
    class="btn btn-primary btn-sm"
    (click)="callPokemonData()"
  >
    Go!
  </button>
</div>
